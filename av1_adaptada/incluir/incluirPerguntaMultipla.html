<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incluir pergunta</title>
</head>
<body>
    <h1>Incluir pergunta de múltipla escolha</h1>

        <form id="formPerguntaMultipla">
            Pergunta: <input type="text" id="pergunta" name="pergunta">
            <br><br>

            a: <input type="text" id="a" name="a">
            <br><br>

            b: <input type="text" id="b" name="b">
            <br><br>

            c: <input type="text" id="c" name="c">
            <br><br>

            Alternativa correta:
            <select id="certa" name="certa">
                <option value="a">A</option>
                <option value="b">B</option>
                <option value="c">C</option>
            </select>
            <br><br>

            <input type="button" value="Cadastrar Pergunta" onclick="incluirPerguntaMultipla()">
        </form>

        <div id="msg"></div>

        <script src="incluirPerguntaMultipla.js"></script>
</body>
</html>
